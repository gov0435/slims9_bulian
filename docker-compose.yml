services:
  slims:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slims9_bulian
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_ENV=${APP_ENV:-production}
    volumes:
      - slims_files:/var/www/html/files
      - slims_repository:/var/www/html/repository
      - slims_images:/var/www/html/images/docs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  slims_files:
    driver: local
  slims_repository:
    driver: local
  slims_images:
    driver: local

# JANGAN define custom networks di sini!
# Coolify otomatis attach container ke network "coolify"
# agar coolify-proxy bisa reach aplikasi tanpa 504 timeout.